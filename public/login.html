<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mahan Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        html { width:100%; height:100%; overflow:hidden; position:fixed; inset:0; }
        body { background: radial-gradient(circle at bottom left, #0f0f16, #1a1a2e); color: #fff; width:100%; height: 100vh; height: 100svh; max-height:100svh; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px; position:fixed; inset:0; overscroll-behavior:none; touch-action:manipulation; }
        .blob { position: fixed; filter: blur(80px); z-index: -1; opacity: 0.4; animation: float 8s infinite ease-in-out alternate; pointer-events:none; }
        .blob1 { width: 400px; height: 400px; background: #d4af37; top: -100px; left: -100px; }
        .blob2 { width: 300px; height: 300px; background: #6366f1; bottom: -50px; right: -50px; animation-delay: -4s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }
        
        .login-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: clamp(18px, 5vh, 42px); width: min(100%, 420px); max-width: 420px; max-height: calc(100svh - 20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); opacity: 0; transform: translateY(10px); animation: fadeUp 0.45s forwards cubic-bezier(0.2, 0.8, 0.2, 1); overflow:hidden; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        
        .logo { text-align: center; margin-bottom: clamp(24px, 6vw, 40px); }
        .logo h1 { color: #fff; font-size: clamp(25px, 8vw, 32px); font-weight: 800; letter-spacing: clamp(2px, 1vw, 4px); text-transform: uppercase; background: linear-gradient(to right, #d4af37, #f3e5ab); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #888; font-size: 12px; margin-top: 5px; letter-spacing: 2px; text-transform: uppercase; }
        
        .input-group { margin-bottom: clamp(16px, 4vw, 25px); position: relative; }
        .input-group label { display: block; color: #aaa; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; color: #fff; outline: none; transition: all 0.3s; font-size: 16px; font-family: 'Outfit', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        input:focus { border-color: #d4af37; background: rgba(0,0,0,0.4); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
        
        button { width: 100%; background: linear-gradient(45deg, #d4af37, #b2891d); border: none; padding: 16px; border-radius: 12px; color: #000; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }
        button:active { transform: translateY(0); }
        
        .error { display: none !important; }
        @media (max-width: 480px) {
            body { align-items: center; padding: 10px; }
            .blob { filter: blur(56px); opacity: .30; }
            .blob1 { width: 240px; height: 240px; top: -90px; left: -95px; }
            .blob2 { width: 200px; height: 200px; bottom: -95px; right: -90px; }
            .login-card { border-radius: 20px; padding: 20px 16px; max-height: calc(100svh - 20px); }
            .logo { margin-bottom: 20px; }
            .logo p { font-size: 10px; letter-spacing: 1.4px; }
            .input-group { margin-bottom: 14px; }
            input { padding: 13px 14px; }
            button { padding: 14px; font-size: 14px; margin-top: 4px; }
        }
        @media (max-height: 620px) {
            body { align-items: center; padding: 8px; }
            .login-card { margin: 0; padding: 14px 16px; max-height: calc(100svh - 16px); transform:none; }
            .logo { margin-bottom: 14px; }
            .logo h1 { font-size: 24px; }
            .input-group { margin-bottom: 10px; }
            input { padding: 11px 12px; }
            button { padding: 12px; margin-top: 2px; }
        }
    
        /* FINAL MOBILE NO-SCROLL FIX */
        html, body { width:100% !important; height:calc(var(--vh, 1vh) * 100) !important; max-height:calc(var(--vh, 1vh) * 100) !important; min-height:0 !important; overflow:hidden !important; position:fixed !important; inset:0 !important; }
        body { padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)) !important; }
        .login-card { max-height: calc((var(--vh, 1vh) * 100) - 18px) !important; overflow:hidden !important; transform:none !important; }
        @media (max-width: 480px) {
            .login-card { padding: 16px 15px !important; border-radius: 18px !important; }
            .logo { margin-bottom: 14px !important; }
            .logo h1 { font-size: 23px !important; letter-spacing: 2px !important; }
            .logo p { font-size: 9px !important; margin-top: 3px !important; }
            .input-group { margin-bottom: 10px !important; }
            .input-group label { margin-bottom: 6px !important; }
            input { padding: 11px 12px !important; font-size: 16px !important; }
            button { padding: 12px !important; margin-top: 2px !important; }
        }
        @media (max-height: 560px) {
            .login-card { padding: 12px 14px !important; }
            .logo { margin-bottom: 10px !important; }
            .logo h1 { font-size: 21px !important; }
            .logo p { display:none !important; }
            .input-group { margin-bottom: 8px !important; }
            input { padding: 10px 11px !important; }
            button { padding: 11px !important; }
        }

    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="login-card">
        <div class="logo">
            <h1>MAHAN PANEL</h1>
            <p>Node WS Gateway</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" id="username" placeholder="admin" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Secret Key</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Authenticate</button>
        </form>
    </div>

    <script>
        function setViewportHeight() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', function(){ setTimeout(setViewportHeight, 250); });
        document.addEventListener('touchmove', function(e) { if (!e.target.closest('input')) e.preventDefault(); }, { passive:false });
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.querySelector('button');
            
            btn.style.background = 'linear-gradient(45deg, #d4af37, #b2891d)';
            btn.style.color = '#000';
            btn.textContent = 'Verifying...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.success) {
                    btn.style.background = 'linear-gradient(45deg, #22c55e, #16a34a)';
                    btn.style.color = '#fff';
                    btn.textContent = 'Access Granted';
                    setTimeout(() => window.location.href = '/panel', 600);
                } else {
                    btn.style.background = 'linear-gradient(45deg, #ef4444, #b91c1c)';
                    btn.style.color = '#fff';
                    btn.textContent = 'Access Denied';
                    setTimeout(() => {
                        btn.style.background = 'linear-gradient(45deg, #d4af37, #b2891d)';
                        btn.style.color = '#000';
                        btn.textContent = 'Authenticate';
                    }, 1400);
                }
            } catch (error) {
                btn.style.background = 'linear-gradient(45deg, #ef4444, #b91c1c)';
                btn.style.color = '#fff';
                btn.textContent = 'Access Denied';
                setTimeout(() => {
                    btn.style.background = 'linear-gradient(45deg, #d4af37, #b2891d)';
                    btn.style.color = '#000';
                    btn.textContent = 'Authenticate';
                }, 1400);
            }
        });
    </script>

</html>
